name: Temporary approved PsiTrends poster import
on:
  push:
    branches:
      - chatgpt/psitrends-eight-approved-videos-2026-10-01
permissions:
  contents: write
jobs:
  posters:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/psitrends-eight-approved-videos-2026-10-01
      - name: Import exact approved posters
        shell: bash
        run: |
          set -euo pipefail
          dir=integrations/psitrends-client/approved-video-posters
          mkdir -p "$dir"
          base_old='https://raw.githubusercontent.com/andylitvinov-design/books/518ea0a523bd1f956819def063a327a1f964b030/public/images/holistic-house/video-posters'
          base_new='https://raw.githubusercontent.com/andylitvinov-design/books/491fdbe118f203d4b95036a164afd30a4075649b/public/images/holistic-house/video-posters'
          curl -fsSL "$base_old/home-en-v2.webp" -o "$dir/home-en-v2.webp"
          curl -fsSL "$base_old/services-en-v2.webp" -o "$dir/services-en-v2.webp"
          curl -fsSL "$base_old/homeopathy-en-v2.webp" -o "$dir/homeopathy-en-v2.webp"
          curl -fsSL "$base_old/home-ru-v1.webp" -o "$dir/home-ru-v1.webp"
          curl -fsSL "$base_old/services-ru-v1.webp" -o "$dir/services-ru-v1.webp"
          curl -fsSL "$base_old/homeopathy-ru-v1.webp" -o "$dir/homeopathy-ru-v1.webp"
          curl -fsSL "$base_new/hypnotherapy-en-v1.webp" -o "$dir/hypnotherapy-en-v1.webp"
          curl -fsSL "$base_new/constellations-en-v1.webp" -o "$dir/constellations-en-v1.webp"
          cat > /tmp/expected.sha256 <<'EOF'
          8f1ae79ad0764324cbf6023db4761a8ff4e9c55c0a085259beccd671cae4da04  integrations/psitrends-client/approved-video-posters/home-en-v2.webp
          eba5a152b8fba5293b6046f8569205cafb641c852709f284893308b6846fdad6  integrations/psitrends-client/approved-video-posters/services-en-v2.webp
          9b2386a700b110249f285ff14d01c692e315a312083b46eab59b99930b0c6261  integrations/psitrends-client/approved-video-posters/homeopathy-en-v2.webp
          2d17a8df9b325272d4c1049cb7757733a00fbafed652b49ffdd0bdf68bc8b794  integrations/psitrends-client/approved-video-posters/home-ru-v1.webp
          b0c25264bd03966fea4a07e2b654a5d12dc2066dd4fe91845facc06352257819  integrations/psitrends-client/approved-video-posters/services-ru-v1.webp
          9c186803e5bfed18f3eecac5c4be3cf8fb90c24a1821b1315ab6adf67f31f335  integrations/psitrends-client/approved-video-posters/homeopathy-ru-v1.webp
          fa1ec9b1769fd460664c2172670c11e4f5628f91d16a450c64be144fae973395  integrations/psitrends-client/approved-video-posters/hypnotherapy-en-v1.webp
          dcc44198296eff227e16d5645d4b5c01d8217915d204515fd2f25afa9417fc21  integrations/psitrends-client/approved-video-posters/constellations-en-v1.webp
          EOF
          sha256sum -c /tmp/expected.sha256
      - name: Commit posters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/psitrends-client/approved-video-posters
          git diff --cached --quiet || git commit -m 'Import eight approved page-video posters'
          git push origin HEAD:chatgpt/psitrends-eight-approved-videos-2026-10-01
