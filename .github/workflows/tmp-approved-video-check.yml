name: Temporary PsiTrends approved-video checks
on:
  push:
    branches:
      - chatgpt/psitrends-eight-approved-videos-2026-10-01
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit and build tests
        run: node --test integrations/psitrends-client/*.test.mjs integrations/joomla-client/*.test.mjs
      - name: Build static and native packages
        run: |
          node scripts/build-psitrends-client.mjs
          node scripts/build-joomla-client.mjs
          php -l integrations/joomla-client/template/index.php
          php -l integrations/joomla-client/update-client.php
          php integrations/joomla-client/clear-client-cache.php self-test
          npx stylelint psitrends-client.css
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Browser-check eight approved videos
        run: |
          python3 -m http.server 8877 --bind 127.0.0.1 >/tmp/psitrends-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 2
          PSITRENDS_BASE_URL=http://127.0.0.1:8877/output/psitrends-client node integrations/psitrends-client/approved-videos-browser.mjs
