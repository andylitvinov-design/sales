name: PsiTrends approved video verification
on:
  pull_request:
    paths:
      - 'integrations/psitrends-client/**'
      - 'integrations/joomla-client/**'
      - 'psitrends-client*'
      - 'scripts/build-psitrends-client.mjs'
      - 'scripts/build-joomla-client.mjs'
      - '.github/workflows/psitrends-video-review.yml'
permissions:
  contents: read
concurrency:
  group: psitrends-video-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate source, exact assets and native packaging
        run: |
          set -euo pipefail
          mkdir -p reports/approved-videos
          node --test integrations/psitrends-client/*.test.mjs integrations/joomla-client/*.test.mjs | tee reports/approved-videos/unit-tests.txt
          php -l integrations/joomla-client/update-client.php
          php -l integrations/joomla-client/template/index.php
          node scripts/build-psitrends-client.mjs
          node scripts/build-joomla-client.mjs
          git diff --exit-code -- 'psitrends-client-*.html' 'psitrends-client-*.css'
      - name: HTML and CSS validation
        run: |
          set -euo pipefail
          npx --no-install html-validate psitrends-client-consultations.html psitrends-client-consultations-ru.html psitrends-client-home.html psitrends-client-home-ru.html psitrends-client-hypnotherapy.html psitrends-client-hypnotherapy-ru.html psitrends-client-constellations.html psitrends-client-constellations-ru.html psitrends-client-about.html psitrends-client-about-ru.html 2>&1 | tee reports/approved-videos/html-validation.txt
          npx --no-install stylelint psitrends-client.css 2>&1 | tee reports/approved-videos/style-validation.txt
      - name: Install isolated browser engines
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Local browser verification, no live mutations
        run: |
          set -euo pipefail
          python3 -m http.server 8877 --bind 127.0.0.1 --directory output/psitrends-client > reports/approved-videos/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 20); do curl -fsS http://127.0.0.1:8877/ >/dev/null && break || sleep 1; done
          node integrations/psitrends-client/approved-videos-browser.mjs 2>&1 | tee reports/approved-videos/browser-log.txt
      - name: Package audited native release input
        if: success()
        run: |
          git rev-parse HEAD > reports/approved-videos/source-commit.txt
          tar -czf reports/approved-videos/psitrends-native-video-package.tar.gz -C integrations/joomla-client generated update-client.php clear-client-cache.php
          cp docs/psitrends-approved-videos-release.md reports/approved-videos/RELEASE-GATE.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psitrends-approved-video-verification
          path: reports/approved-videos/
          retention-days: 7
          if-no-files-found: error
