<section class="page-video-section shell" data-page-video-kind="hypnotherapy" data-page-video-locale="en"><figure class="page-video" aria-label="How I Work with Hypnotherapy"><div class="page-video-frame"><button class="page-video-play" type="button" disabled aria-busy="true" data-page-video-id="8c1634ce904434a91931429b6a7eefe1" data-page-video-title="How I Work with Hypnotherapy" aria-label="Watch video: How I Work with Hypnotherapy"><img class="page-video-poster" src="/psitrends-client-assets/approved-video-posters/hypnotherapy-en-v1.webp" alt="" width="1280" height="720" loading="lazy"><span class="page-video-shade" aria-hidden="true"></span><span class="page-video-play-icon" aria-hidden="true">▶</span><span class="page-video-duration" aria-hidden="true">0:47</span></button></div><figcaption class="page-video-caption"><details class="page-video-transcript"><summary>Transcript</summary><div class="page-video-transcript-copy"><p class="page-video-transcript-paragraph">Hypnotherapy, for me, is not about losing control or being told what to do.</p><p class="page-video-transcript-paragraph">It is a focused way of working with attention, imagery, and the different parts of your inner experience.</p><p class="page-video-transcript-paragraph">We begin with one real situation — a decision, a repeating reaction, or a place where you understand what you want, but still feel stuck.</p><p class="page-video-transcript-paragraph">Then we explore the pattern behind it, and what changes when you look at the situation from another perspective.</p><p class="page-video-transcript-paragraph">You remain involved in the process. You can ask questions, pause, or change direction at any time.</p><p class="page-video-transcript-paragraph">The goal is not to force an answer, but to understand your own response more deeply and find a clearer next step.</p><p class="page-video-transcript-paragraph">If this feels relevant, you can ask me about a personal session in Toronto or online.</p></div></details><span class="page-video-ai">AI-assisted video using Andy’s digital twin and voice.</span><a class="page-video-fallback" href="https://app.heygen.com/share/8c1634ce904434a91931429b6a7eefe1" target="_blank" rel="noopener noreferrer">Open video</a></figcaption></figure></section>
